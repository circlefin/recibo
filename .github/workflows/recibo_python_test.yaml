name: Recibo Project Python CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions: read-all

env:
  FOUNDRY_PROFILE: ci

jobs:
  run_recibo_tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: block
          policy: global-allowed-endpoints-policy

      - name: Check out repository code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Update submodules
        run: git submodule update --init --recursive
        shell: bash

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e # v1.5.0
        with:
          version: nightly

      - name: Run Forge build
        run: |
          forge --version
          forge build --sizes
        id: build

      - name: Install python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: client

      - name: Wait for Anvil to be ready
        run: |
          anvil &
          echo "Waiting for Anvil to be ready..."
          timeout=180  # 3 minutes
          elapsed=0
          while ! curl -s http://localhost:8545 > /dev/null; do
            sleep 1
            elapsed=$((elapsed + 1))
            if [ $elapsed -ge $timeout ]; then
              echo "Timeout waiting for Anvil to be ready."
              exit 1
            fi
          done
          echo "Anvil is ready."

      - name: Run Python unit tests
        run: |
          python3 test.py
        working-directory: client


